name: Build and publish Biz FOX ERP Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify signing secrets
        env:
          KEYSTORE: ${{ secrets.BIZFOX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BIZFOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BIZFOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BIZFOX_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || (echo "::error::Missing BIZFOX_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Missing BIZFOX_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing BIZFOX_KEY_ALIAS repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing BIZFOX_KEY_PASSWORD repository secret" && exit 1)
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BIZFOX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/biz-fox-erp-release.jks"
          chmod 600 "$RUNNER_TEMP/biz-fox-erp-release.jks"
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        env:
          BIZFOX_KEYSTORE_FILE: ${{ runner.temp }}/biz-fox-erp-release.jks
          BIZFOX_KEYSTORE_PASSWORD: ${{ secrets.BIZFOX_KEYSTORE_PASSWORD }}
          BIZFOX_KEY_ALIAS: ${{ secrets.BIZFOX_KEY_ALIAS }}
          BIZFOX_KEY_PASSWORD: ${{ secrets.BIZFOX_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: biz-fox-erp-signed-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish signed APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Biz FOX ERP v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
