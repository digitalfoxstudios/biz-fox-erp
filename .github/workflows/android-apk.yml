name: Build and publish Biz FOX ERP Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'assets/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
concurrency:
  group: biz-fox-android-release
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install image tooling
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes imagemagick
          fi
      - name: Generate launcher icons from the exact approved logo
        run: |
          set -euo pipefail
          SOURCE=assets/biz-fox-erp-logo.png
          test -s "$SOURCE" || (echo "::error::Missing $SOURCE" && exit 1)
          identify "$SOURCE"
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable-nodpi
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"; size="${spec##*:}"
            convert "$SOURCE" -resize "${size}x${size}" "app/src/main/res/mipmap-${density}/ic_launcher.png"
            convert "$SOURCE" -resize "${size}x${size}" "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          cp "$SOURCE" app/src/main/res/drawable-nodpi/ic_launcher_legacy_image.png
          cp "$SOURCE" app/src/main/res/drawable-nodpi/biz_fox_logo.png
          convert "$SOURCE" -resize 288x288 -gravity center -background none -extent 432x432 app/src/main/res/drawable-nodpi/ic_launcher_foreground_image.png
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify signing secrets
        env:
          KEYSTORE: ${{ secrets.BIZFOX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BIZFOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BIZFOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BIZFOX_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || (echo "::error::Missing BIZFOX_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Missing BIZFOX_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing BIZFOX_KEY_ALIAS repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing BIZFOX_KEY_PASSWORD repository secret" && exit 1)
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BIZFOX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/biz-fox-erp-release.jks"
          chmod 600 "$RUNNER_TEMP/biz-fox-erp-release.jks"
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build the single unified signed release APK
        env:
          BIZFOX_KEYSTORE_FILE: ${{ runner.temp }}/biz-fox-erp-release.jks
          BIZFOX_KEYSTORE_PASSWORD: ${{ secrets.BIZFOX_KEYSTORE_PASSWORD }}
          BIZFOX_KEY_ALIAS: ${{ secrets.BIZFOX_KEY_ALIAS }}
          BIZFOX_KEY_PASSWORD: ${{ secrets.BIZFOX_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Prepare and verify the unified signed APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/biz-fox-erp.apk
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          "$APKSIGNER" verify --verbose dist/biz-fox-erp.apk
      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biz-fox-android-v${{ steps.version.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish the unified signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Biz FOX ERP v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*.apk

# Release: one signed APK for administrator and employee role-based access.
