name: Validate and deploy Biz FOX ERP

on:
  push:
    branches: [main, feature/single-company-unified-experience]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: biz-fox-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/supabase.js
          node --check assets/js/auth.js
          node --check assets/js/staff.js
          node --check assets/js/customer.js
          node --check assets/js/company-setup.js
          node --check service-worker.js

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for Pages artifact registration
        run: sleep 15
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
