<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Register Company · Biz FOX ERP</title><link rel="stylesheet" href="./assets/css/app.css?v=27"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"></head>
<body class="login-body"><main class="login-wrap"><a class="brand login-brand" href="./"><img class="brand-logo" src="./assets/biz-fox-erp-logo.png" alt="Biz FOX ERP"><span><strong>Biz FOX</strong><small>OFFICE AUTOMATION SUITE</small></span></a>
<section class="login-card"><div class="login-heading"><span class="eyebrow">START YOUR BUSINESS WORKSPACE</span><h1>Register your company</h1><p>Create your owner account and set up your company on Biz FOX ERP.</p></div>
<form id="companyRegisterForm" autocomplete="on"><label>Company name<input name="company" required minlength="2" maxlength="120" placeholder="Example: ABC Services"></label><label>Company URL name<input name="slug" required minlength="3" maxlength="50" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="abc-services"></label><label>Owner full name<input name="owner" required maxlength="100" autocomplete="name" placeholder="Your full name"></label><label>Owner email<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><label>Subscription plan<select name="plan" required><option value="starter">Starter · 14-day trial</option><option value="business">Business · 14-day trial</option><option value="enterprise">Enterprise · 14-day trial</option></select></label><button id="registerSubmit" class="primary-button" type="submit">Register company</button><p id="registerMessage" class="form-message" role="status"></p></form>
<div class="auth-links"><p class="form-message">Already registered? <a href="./login.html">Sign in</a></p></div></section><p class="login-foot">© 2026 Biz FOX ERP · Digital FOX Studio</p></main><script type="module" src="./assets/js/company-register.js"></script></body></html>
