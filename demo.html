<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biz FOX ERP · Interactive Demo</title><link rel="stylesheet" href="./assets/css/app.css"></head><body><div class="app-shell"><aside class="sidebar" id="side"><a class="brand" href="./"><span class="brand-mark">FOX</span><span><strong>Biz FOX</strong><small>ERP DEMO</small></span></a><nav id="nav"><button class="nav-item active" data-p="overview">▦ <span>Overview</span></button><p class="nav-label">OFFICE MODULES</p><button class="nav-item" data-p="employees">▣ <span>Administration & HR</span></button><button class="nav-item" data-p="files">▣ <span>Files & e-Office</span></button><button class="nav-item" data-p="letters">▣ <span>Correspondence</span></button><button class="nav-item" data-p="finance">▣ <span>Accounts & Finance</span></button><button class="nav-item" data-p="departments">▣ <span>Departments</span></button><button class="nav-item" data-p="meetings">▣ <span>Meetings</span></button><button class="nav-item" data-p="tasks">▣ <span>Tasks & Work</span></button><button class="nav-item" data-p="assets">▣ <span>Inventory & Assets</span></button><button class="nav-item" data-p="projects">▣ <span>Projects</span></button><button class="nav-item" data-p="notices">▣ <span>Communication</span></button><button class="nav-item" data-p="services">▣ <span>Public Services</span></button><button class="nav-item" data-p="reports">▣ <span>Reports & Audit</span></button><button class="nav-item" data-p="users">▣ <span>Users & Security</span></button></nav><div class="sidebar-foot">DEMO ENVIRONMENT<span>Fictional sample data</span></div></aside><main class="main"><header class="topbar"><button class="menu-toggle" id="menu">☰</button><div><span class="eyebrow">DEMO WORKSPACE</span><h1 id="heading">Overview</h1></div><div class="top-actions"><span class="tag">DEMO ONLY</span><a class="secondary-button" href="./login.html">Exit demo</a></div></header><section class="content" id="view"></section><footer>Biz FOX ERP · Demonstration only</footer></main></div>
<script>
const names={employees:"Administration & HR",files:"Files & e-Office",letters:"Correspondence",finance:"Accounts & Finance",departments:"Departments",meetings:"Meetings & Calendar",tasks:"Tasks & Work",assets:"Inventory & Assets",projects:"Projects",notices:"Communication",services:"Public Services",reports:"Reports & Audit",users:"Users & Security"};
const cols={employees:["Employee code","Full name","Department","Designation","Status"],files:["File number","Subject","Section","Status"],letters:["Reference no.","Subject","Sender / recipient","Date","Status"],finance:["Bill no.","Purpose","Payee","Amount ₹","Status"],departments:["Code","Department","Head"],meetings:["Meeting","Date","Location","Status"],tasks:["Task","Assigned to","Due date","Status"],assets:["Asset code","Asset","Quantity","Location"],projects:["Project code","Project","Budget","Status"],notices:["Notice","Published on","Status"],services:["Tracking no.","Applicant","Service / issue","Date","Status"],reports:["Date","Activity","User"],users:["Name","Email","Role"]};
const seed={employees:[["EMP-001","Aarav Sharma","Administration","Office Superintendent","Active"],["EMP-002","Neha Verma","Accounts","Accountant","Active"],["EMP-003","Imran Khan","Engineering","Junior Engineer","On leave"]],files:[["OF/2026/001","Annual maintenance proposal","Administration","Pending review"],["OF/2026/002","Office equipment purchase","Accounts","In process"]],letters:[["IN-2026-014","Road repair request","Gram Panchayat","20 Nov 2026","Registered"],["OUT-2026-008","Monthly progress report","Block Office","22 Nov 2026","Dispatched"]],finance:[["BILL-026","Computer maintenance","ABC Services","18500","Submitted"],["BILL-027","Stationery purchase","City Traders","7200","Draft"]],departments:[["ADM","Administration","Aarav Sharma"],["ACC","Accounts","Neha Verma"],["ENG","Engineering","Imran Khan"]],meetings:[["Monthly review meeting","28 Nov 2026","Conference room","Scheduled"]],tasks:[["Prepare monthly report","Neha Verma","26 Nov 2026","In progress"],["Verify asset register","Aarav Sharma","29 Nov 2026","Pending"]],assets:[["AST-001","Desktop computer","12 Nos","IT room"],["AST-002","Laser printer","4 Nos","Administration"]],projects:[["PRJ-014","Village road improvement","₹12,50,000","Active"],["PRJ-015","Community hall renovation","₹8,00,000","Planning"]],notices:[["Office working hours update","18 Nov 2026","Published"]],services:[["APP-101","Ramesh Patel","Building permission","21 Nov 2026","Under review"]],reports:[["23 Nov 2026","Asset register updated","Aarav Sharma"],["22 Nov 2026","Bill BILL-026 submitted","Neha Verma"]],users:[["Aarav Sharma","aarav@example.com","Owner"],["Neha Verma","neha@example.com","Accounts"],["Imran Khan","imran@example.com","Staff"]]};
let db=JSON.parse(sessionStorage.getItem("bizfoxDemo")||"null")||structuredClone(seed),page="overview";
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){document.querySelectorAll("[data-p]").forEach(b=>b.classList.toggle("active",b.dataset.p===page));document.getElementById("heading").textContent=page==="overview"?"Overview":names[page];const v=document.getElementById("view");if(page==="overview"){v.innerHTML='<div class="welcome"><div><span class="eyebrow">SAMPLE ORGANIZATION</span><h2>Greenfield Block Office</h2><p>Interactive demonstration · All records are fictional</p></div><span class="welcome-icon">✦</span></div><div class="stats-grid">'+[['Open files',db.files.length],['Pending tasks',db.tasks.filter(x=>x[3]!=="Completed").length],['Projects',db.projects.length],['Employees',db.employees.length]].map(x=>'<article class="stat-card"><p>'+x[0]+'</p><strong>'+x[1]+'</strong><small>Demo records</small></article>').join('')+'</div><div class="section-heading"><div><h3>Explore modules</h3><p>Open any module from the left menu.</p></div></div><div class="notice"><strong>Safe demo mode</strong><p>Try adding or deleting records. Changes stay in this browser tab only and never reach your real office database.</p></div>';return;}
const headers=cols[page]||[],rows=db[page]||[],canAdd=!["reports","users"].includes(page);v.innerHTML='<div class="data-page"><div class="data-page-head"><div><span class="tag">Interactive sample register</span><h2>'+names[page]+'</h2><p>Fictional data · Local-only changes</p></div><button class="secondary-button" id="back">Overview</button></div>'+(canAdd?'<form id="add" class="record-form"><div class="form-grid">'+headers.map((h,i)=>'<label>'+h+'<input name="f'+i+'" required></label>').join('')+'</div><button class="primary-button" type="submit">Add demo record</button><p id="msg" class="form-message"></p></form>':'')+'<div class="records-heading"><h3>Sample register</h3><span>'+rows.length+' records</span></div><div class="records-table"><div class="table-scroll"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+(canAdd?'<th>Action</th>':'')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+(canAdd?'<td><button class="secondary-button" data-del="'+i+'">Delete</button></td>':'')+'</tr>').join('')+'</tbody></table></div></div></div>';
document.getElementById("back").onclick=()=>go("overview");document.getElementById("add")?.addEventListener("submit",e=>{e.preventDefault();db[page].unshift(headers.map((_,i)=>e.target.elements["f"+i].value));sessionStorage.setItem("bizfoxDemo",JSON.stringify(db));render();});v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{db[page].splice(+b.dataset.del,1);sessionStorage.setItem("bizfoxDemo",JSON.stringify(db));render();});}
function go(p){page=p in names||p==="overview"?p:"overview";render();}document.addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(b)go(b.dataset.p);});document.getElementById("menu").onclick=()=>document.getElementById("side").classList.toggle("open");render();
</script></body></html>
