<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827">
<title>Set new password · Biz FOX ERP</title>
<link rel="stylesheet" href="./assets/css/app.css?v=29"><link rel="stylesheet" href="./assets/css/redesign.css?v=2">
<style>.reset-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.reset-card{width:min(100%,440px);background:var(--card,#fff);padding:28px;border-radius:18px;box-shadow:0 16px 48px #0002}.reset-card h1{margin:0 0 8px}.reset-card label{display:block;margin:18px 0 6px}.reset-card input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px}.reset-card button{width:100%;margin-top:18px}.reset-message{min-height:24px;margin-top:12px}</style>
</head>
<body class="login-body"><main class="reset-wrap"><section class="reset-card">
<a class="brand login-brand" href="./login.html"><img class="brand-logo" src="./assets/biz-fox-erp-logo.png" alt="Biz FOX ERP"><span><strong>Biz FOX</strong><small>OFFICE AUTOMATION SUITE</small></span></a>
<h1>Set a new password</h1><p>Choose a new password for your Biz FOX ERP account.</p>
<form id="resetForm"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter it again"><button id="savePassword" class="primary-button" type="submit">Save new password</button><p id="resetMessage" class="reset-message form-message" role="status" aria-live="polite"></p></form>
<p><a href="./login.html">Back to sign in</a></p></section></main>
<script type="module">
import { supabase } from "./assets/js/supabase.js";
const form=document.getElementById("resetForm"),message=document.getElementById("resetMessage"),button=document.getElementById("savePassword");
const say=(text,kind="")=>{message.textContent=text;message.className="reset-message form-message "+kind;};
let recoveryReady=false;
supabase.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session){recoveryReady=true;say("Recovery link verified. You can now set your new password.","success");}});
const {data:{session}}=await supabase.auth.getSession();
if(session){recoveryReady=true;say("Recovery session detected. Enter your new password.");}
else if(location.hash.includes("access_token=")||new URLSearchParams(location.search).has("code")){say("Verifying your secure recovery link…");}
else{say("Open this page using the password-reset link sent to your email.","error");}
form.addEventListener("submit",async event=>{
 event.preventDefault();
 const password=document.getElementById("newPassword").value,confirm=document.getElementById("confirmPassword").value;
 if(password.length<8){say("Use at least 8 characters.","error");return;}
 if(password!==confirm){say("The passwords do not match.","error");return;}
 button.disabled=true;button.textContent="Saving…";
 const {data:{session:activeSession}}=await supabase.auth.getSession();
 if(!activeSession){say("Your recovery link is invalid or expired. Request a new reset email.","error");button.disabled=false;button.textContent="Save new password";return;}
 const {error}=await supabase.auth.updateUser({password});
 button.disabled=false;button.textContent="Save new password";
 if(error){say(error.message,"error");return;}
 say("Password updated successfully. Redirecting to sign in…","success");
 await supabase.auth.signOut();
 setTimeout(()=>location.replace("./login.html?password=updated"),1200);
});
</script></body></html>
